[project]
name = "camelot-api"
version = "0.1.0"
description = "camelot PDF table extraction RPC service for Rust interop"
authors = [
    { name = "lemos", email = "xfe1235@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "camelot-py>=2.0.0",
    "opencv-python-headless>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
]

[project.scripts]
camelot-api = "camelot_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
